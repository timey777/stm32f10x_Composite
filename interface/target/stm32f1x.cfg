# 基本配置
source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

# 芯片参数设置
set _CHIPNAME stm32f1x
set _ENDIAN little
set _WORKAREASIZE 0x8000  # RAM工作区大小

# 调试接口配置
if { [info exists TRANSPORT] } {
    transport select $TRANSPORT
} else {
    transport select "swd"  # 默认使用SWD接口
}

# 时钟配置
set _CPUTAPID 0x1ba01477  # Cortex-M3的JTAG IDCODE
set CLOCK_FREQ 8000       # 调试时钟频率(kHz)

# 复位控制
reset_config srst_only srst_nogate
set CONNECT_UNDER_RESET 0

# 低功耗模式支持
set ENABLE_LOW_POWER 1
set STOP_WATCHDOG 1       # 暂停看门狗计数器

# 内存布局
set FLASH_SIZE 0x10000   # 64KB Flash（需根据实际型号调整）
set _ROMBASE 0x08000000  # Flash起始地址
set _RAMBASE 0x20000000  # RAM起始地址

# GDB调试端口
set GDB_PORT 3333